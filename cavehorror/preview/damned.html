<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xem trước The Damned</title>
<style>
  :root { --bg: #0b0d12; --panel: #141821; --line: #252b38; --text: #d8dce6; --dim: #8a93a6; --accent: #c9534a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #side { width: 250px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #side h1 { font-size: 15px; margin: 14px 16px 4px; letter-spacing: .3px; }
  #side p.sub { margin: 0 16px 10px; color: var(--dim); font-size: 12px; }
  #list { overflow: auto; flex: 1; padding: 0 8px 12px; }
  .it { padding: 8px 10px; border-radius: 8px; cursor: pointer; margin: 2px 0; border: 1px solid transparent; }
  .it:hover { background: #1b2130; }
  .it.on { background: #22283a; border-color: #3a435a; }
  .it b { display: block; font-weight: 600; font-size: 13px; }
  .it span { color: var(--dim); font-size: 11.5px; }
  #main { flex: 1; position: relative; display: flex; flex-direction: column; min-width: 0; }
  #view { flex: 1; position: relative; min-height: 0; }
  canvas { width: 100%; height: 100%; display: block; }
  #bar { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { background: #222838; color: var(--text); border: 1px solid #343c52; border-radius: 7px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  button.on { background: #3b2a2c; border-color: var(--accent); }
  input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 92px; }
  #cap { position: absolute; left: 16px; top: 14px; right: 16px; color: var(--dim); font-size: 13px; pointer-events: none; }
  #cap b { color: var(--text); font-size: 15px; }
  #cue { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); color: #e7d9c4; font-style: italic; letter-spacing: 1px; opacity: 0; transition: opacity .25s; pointer-events: none; text-shadow: 0 0 8px #000; }
  label { color: var(--dim); font-size: 12.5px; display: flex; gap: 5px; align-items: center; }
  @media (max-width: 720px) { body { flex-direction: column; } #side { width: 100%; height: 38vh; } }
</style>
</head>
<body>
<div id="side">
  <h1>The Damned, xem trước ngoại tuyến</h1>
  <p class="sub">Mô hình, texture và file động tác lấy thẳng từ bản mod 1.7.0. Kéo chuột để xoay, cuộn để thu phóng.</p>
  <div id="list"></div>
</div>
<div id="main">
  <div id="view"><canvas id="c"></canvas>
  <div id="cap"></div>
  <div id="cue"></div></div>
  <div id="bar">
    <button id="play">Tạm dừng</button>
    <button id="restart">Phát lại</button>
    <input id="scrub" type="range" min="0" max="1000" value="0">
    <span id="time">0.00 / 0.00 s</span>
    <button data-cam="pov" class="on">Mắt người chơi</button>
    <button data-cam="side">Bên cạnh</button>
    <button data-cam="top">Trên xuống</button>
    <button data-cam="spin">Tự xoay</button>
    <label><input id="slow" type="checkbox"> Chậm 0,5</label>
    <label><input id="bug" type="checkbox"> Lỗi cũ (nghiêng 90°)</label>
    <label><input id="snd" type="checkbox" checked> Âm thanh</label>
  </div>
</div>
