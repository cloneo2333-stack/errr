plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = 'vn.cavemind'

base {
    archivesName = 'cavemind'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('runc')
            property 'forge.logging.console.level', 'info'
            property 'cavemind.selftest', 'true'
            property 'cavemind.clienttest', 'true'
            args '--quickPlaySingleplayer', 'cmtest', '--username', 'Tester'
            mods {
                cavemind {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'cavemind.selftest', 'true'
            args '--nogui'
            mods {
                cavemind {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'cavemind.refmap.json'
    config 'cavemind.mixins.json'
}

repositories {
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly files('libs/voicechat-api.jar')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [mod_version: mod_version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : 'cavemind',
            'Specification-Vendor'    : 'cavemind',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'cavemind',
            'MixinConfigs'            : 'cavemind.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
