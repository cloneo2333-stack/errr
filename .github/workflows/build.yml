name: Build Cave Mind

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cavehorror/cavemind

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-read-only: false

      - name: Read mod version
        id: meta
        run: |
          version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The repo carries a local build/ and .gradle/ from a Windows machine; start from a clean slate.
      - name: Clean stale local build output
        run: rm -rf build .gradle

      - name: Compile (check for compile errors)
        run: gradle compileJava --no-daemon --stacktrace

      - name: Build jar
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cavemind-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: cavehorror/cavemind/build/libs/cavemind-${{ steps.meta.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 30
